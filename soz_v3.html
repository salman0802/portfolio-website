        // Typing effect handler
        function typeWriterHTML(element, htmlString, speed = 15) {
            if (typingTimer) clearTimeout(typingTimer);
            
            element.innerHTML = '';
            let i = 0;
            let currentHTML = '';
            let isTag = false;

            function type() {
                if (i < htmlString.length) {
                    let char = htmlString.charAt(i);
                    currentHTML += char;
                    i++;

                    if (char === '<') isTag = true;
                    if (char === '>') isTag = false;

                    if (isTag) {
                        type(); 
                    } else {
                        element.innerHTML = currentHTML;
                        typingTimer = setTimeout(type, speed);
                    }
                }
            }
            
            type();
        }

        function toggleTheme() {
            let isDark = document.documentElement.classList.contains('dark');
            setTheme(isDark ? 'light' : 'dark', true);
        }

        function setTheme(theme, save = true) {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                if (!isDockMode) document.body.className = "bg-gradient-to-br from-slate-950 via-blue-950 to-slate-900 text-slate-100 font-sans h-screen overflow-hidden flex flex-col";
            } else {
                document.documentElement.classList.remove('dark');
                if (!isDockMode) document.body.className = "bg-gradient-to-br from-slate-100 via-blue-50 to-slate-200 text-slate-900 font-sans h-screen overflow-hidden flex flex-col";
            }
            if (save) localStorage.setItem('zion_theme', theme);
            
            let icon = document.getElementById('themeToggleIcon');
            if (icon) icon.className = theme === 'dark' ? 'fa-solid fa-sun text-amber-400 text-sm' : 'fa-solid fa-moon text-blue-600 text-sm';

            if (dockIcon) dockIcon.className = theme === 'dark' ? 'fa-solid fa-sun text-xs text-amber-400' : 'fa-solid fa-moon text-xs text-blue-600';
        }

        async function loadRoomDatabase(roomCode) {
            if (typeof songs !== 'undefined' && Array.isArray(songs)) {
                appSongs = JSON.parse(JSON.stringify(songs));
            } else {
                appSongs = [];
            }

            try {
                let doc = await db.collection("song_databases").doc(roomCode).get();
                if (doc.exists && doc.data().customSongs) {
                    let dbCustom = doc.data().customSongs;
                    dbCustom.forEach(cSong => {
                        let idx = appSongs.findIndex(s => s.SongNumber == cSong.SongNumber || s.id == cSong.id);
                        if (idx >= 0) appSongs[idx] = cSong;
                        else appSongs.push(cSong);
                    });
                }
            } catch (e) { console.warn("Cloud DB load error", e); }

            renderAccordionCategories();
            if (appSongs.length > 0) loadSong(appSongs[0].SongNumber, true);
        }

        function processPipesInText(text) {
            if (!text) return '';
            if (obsConfig.hidePipesText) {
                return text.replace(/<ch>.*?<\/ch>/g, '').replace(/\|\|[\s\S]*?\|\|/g, '').trim();
            }
            return text.replace(/<ch>(.*?)<\/ch>/gi, "$1");
        }

        function triggerProjection(rawText, songNum, stanzaKey) {
            let processedText = processPipesInText(rawText);
            let htmlText = processedText.replace(/<br\s*[\/]?>/gi, "<br/>");
            let plainText = htmlText.replace(/<[^>]+>/g, '\n').replace(/\n\n+/g, '\n').trim();

            if (obsConnected) sendToOBSWebSocket(plainText);

            db.collection("sessions").doc(currentSessionId).set({
                activeTextPlain: plainText,
                activeTextHtml: htmlText,
                activeSongNum: songNum || null,
                activeStanzaKey: stanzaKey || null,
                obsConfig: obsConfig,
                isClear: false,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            updateLocalUI(htmlText, songNum, stanzaKey, false);
        }

        function clearScreenMaster() {
            if (obsConnected) sendToOBSWebSocket("");
            db.collection("sessions").doc(currentSessionId).set({
                isClear: true,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
            
            bibleState.lastSelectedVerseNum = null;
            renderBibleDrillDown();
            updateLocalUI("", null, null, true);
        }

        function updateLocalUI(htmlText, songNum, stanzaKey, isClear) {
            if (isClear) {
                document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active-projection'));
                let preview = document.getElementById('livePreviewBox');
                if (preview && !isDockMode) preview.innerHTML = '<span class="text-slate-400 dark:text-slate-500 italic">Screen Cleared</span>';
            } else {
                if (songNum && (!activeSong || activeSong.SongNumber !== songNum)) loadSong(songNum, true);
                document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active-projection'));

                if (songNum && stanzaKey) {
                    let activeEl = document.getElementById(`lyric_line_${songNum}_${String(stanzaKey).replace(/\s+/g, '_')}`);
                    if (activeEl) {
                        activeEl.classList.add('active-projection');
                        activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
                let preview = document.getElementById('livePreviewBox');
                if (preview && !isDockMode) preview.innerHTML = htmlText;
            }
        }

        function initFirebaseSync() {
            if (firestoreUnsubscribe) firestoreUnsubscribe();
            firestoreUnsubscribe = db.collection("sessions").doc(currentSessionId).onSnapshot((doc) => {
                if (doc.exists) {
                    var data = doc.data();
                    if (data.obsConfig) obsConfig = data.obsConfig;
                    
                    if (isDisplayMode) {
                        let textElem = document.getElementById('obsDisplayText');
                        if (data.isClear) {
                            if (typingTimer) clearTimeout(typingTimer);
                            textElem.innerHTML = '';
                        }
                        else if (data.activeTextHtml) {
                            typeWriterHTML(textElem, data.activeTextHtml, 15); 
                        }
                        return;
                    }
                    
                    if (data.isClear) updateLocalUI("", null, null, true);
                    else if (data.activeTextHtml) updateLocalUI(data.activeTextHtml, data.activeSongNum, data.activeStanzaKey, false);
                }
            });
        }

        function joinRoom() {
            let newRoom = (isDockMode ? document.getElementById('dockRoomCodeInput') : document.getElementById('roomCodeInput')).value.trim().toUpperCase();
            if (newRoom && newRoom !== currentSessionId) {

                loadRoomDatabase(currentSessionId);
                initFirebaseSync();
                alert(`Joined Room: ${newRoom}`);
            }
        }

        async function connectOBS() {
            let url = (isDockMode ? document.getElementById('dockObsUrl') : document.getElementById('obsUrl')).value || 'ws://127.0.0.1:4455';
            let password = (isDockMode ? document.getElementById('dockObsPassword') : document.getElementById('obsPassword')).value || '';
            let badge = document.getElementById('obsStatusBadge');
            let dockBadge = document.getElementById('dockObsStatusBadge');

            try {
                if (ws) ws.close();
                ws = new WebSocket(url);
                ws.onopen = () => console.log("Connected to OBS WebSocket");

                ws.onmessage = async (event) => {
                    let msg = JSON.parse(event.data);
                    if (msg.op === 0) {
                        let auth = null;
                        if (msg.d.authentication && password) {
                            async function sha256(m) {
                                const msgB = new TextEncoder().encode(m);
                                const hashB = await crypto.subtle.digest('SHA-256', msgB);
                                return btoa(String.fromCharCode.apply(null, Array.from(new Uint8Array(hashB))));
                            }
                            const secret = await sha256(password + msg.d.authentication.salt);
                            auth = await sha256(secret + msg.d.authentication.challenge);
                        }
                        ws.send(JSON.stringify({ op: 1, d: { rpcVersion: 1, authentication: auth } }));
                    } else if (msg.op === 2) {
                        obsConnected = true;
                        if (badge) {
                            badge.className = "px-2.5 py-1.5 rounded-xl bg-emerald-500/20 text-emerald-600 dark:text-emerald-300 border border-emerald-500/40 text-[11px] font-bold flex items-center gap-1.5 shadow-sm shrink-0";
                            badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>OBS WS Connected`;
                        }
                        if (dockBadge) dockBadge.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
                    }
                };
                ws.onerror = () => alert("OBS Connection failed.");
                ws.onclose = () => { 
                    obsConnected = false; 
                    if (dockBadge) dockBadge.className = "w-2 h-2 rounded-full bg-red-500";
                };
            } catch (error) { console.error("OBS Connection Error", error); }
        }

        function sendToOBSWebSocket(plainText) {
            if (obsConnected && ws && ws.readyState === WebSocket.OPEN) {
                let sourceName = document.getElementById('obsSourceName') ? document.getElementById('obsSourceName').value : 'Lyrics';
                ws.send(JSON.stringify({
                    op: 6,
                    d: {
                        requestType: "SetInputSettings",
                        requestId: "req_" + Date.now(),
                        requestData: { inputName: sourceName, inputSettings: { text: plainText } }
                    }
                }));
            }
        }

                            el.classList.add('text-gray-600', 'dark:text-[#aaa]');

                            el.classList.add('bg-slate-200/60', 'dark:bg-white/10', 'text-slate-700', 'dark:text-slate-300');
                        }
                    }
                }
            });

        function loadSong(songNum, isSilentLoad = false) {
            activeSong = appSongs.find(s => s.SongNumber == songNum);
            if (!activeSong) return;

            document.getElementById('displaySongNum').textContent = activeSong.SongNumber;
            let tParts = activeSong.title.split('||');
            document.getElementById('displayTitle').innerHTML = tParts.length === 2 ?
                `<div class="space-y-0.5"><h2 class="text-lg sm:text-2xl font-extrabold text-slate-900 dark:text-slate-100 font-telugu leading-snug">${tParts[1].trim()}<p class="text-xs font-bold uppercase text-blue-600 dark:text-blue-400 font-sans">${tParts[0].trim()}</p></h2></div>`
                : `<h2 class="text-lg sm:text-2xl font-extrabold text-slate-900 dark:text-slate-100 font-telugu leading-snug">${activeSong.title}</h2>`;

            var fMeta = document.getElementById('fixed_song_meta');
            var fLyrics = document.getElementById('full_song_lyrics');
            if (!isDockMode) {
                fMeta.style.fontSize = currentFontSize + 'px';
                fLyrics.style.fontSize = currentFontSize + 'px';
            }
            fMeta.innerHTML = '';
            fLyrics.innerHTML = '';

            var songObj = activeSong.Song;
            function createLyricBlock(key, content, isFixed) {
                var div = document.createElement('div');
                div.id = `lyric_line_${songNum}_${String(key).replace(/\s+/g, '_')}`;
                
                div.className = isDockMode 
                    ? `p-2 mb-1 bg-white dark:bg-[#333] border border-gray-200 dark:border-[#222] rounded text-[13px] text-gray-900 dark:text-[#eee] shadow-sm lyric-line font-telugu flex gap-2 items-center ${isFixed ? 'border-l-4 border-l-amber-500' : ''}` 
                    : (isFixed ? `p-2.5 rounded-r-xl font-medium shadow-sm lyric-line font-telugu ${key === 'Chorus' ? 'bg-amber-50 dark:bg-amber-950/40 border-l-4 border-amber-500 text-amber-900 dark:text-amber-200' : 'bg-purple-50 dark:bg-purple-950/40 border-l-4 border-purple-500 text-purple-900 dark:text-purple-200'}` : `p-3 sm:p-4 bg-white/70 dark:bg-slate-800/70 hover:bg-blue-50/50 dark:hover:bg-slate-800 border border-slate-200/70 dark:border-slate-700 rounded-2xl transition lyric-line flex gap-3 items-center backdrop-blur-sm shadow-xs text-slate-900 dark:text-slate-100`);

                if (isFixed) {
                    div.innerHTML = content.replace(/<ch>(.*?)<\/ch>/gi, '<span class="float-right text-blue-600 dark:text-blue-400 ml-4 pr-2">$1</span>');
                } else {
                    div.innerHTML = `<span class="text-[10px] font-bold bg-gray-200 dark:bg-slate-700 text-gray-700 dark:text-slate-200 px-2 py-0.5 rounded shrink-0 font-sans">${key}</span><div class="flex-1 font-telugu">${content.replace(/<ch>(.*?)<\/ch>/gi, '<span class="float-right ml-4 pr-2 text-blue-600 dark:text-blue-400">$1</span>')}</div>`;
                }
                div.onclick = () => triggerProjection(content, songNum, key);
                (isFixed ? fMeta : fLyrics).appendChild(div);
            }

            if (songObj.Chorus) createLyricBlock('Chorus', songObj.Chorus, true);
            if (songObj.Bridge) createLyricBlock('Bridge', songObj.Bridge, true);
            Object.keys(songObj).forEach(key => {
                if (key !== 'Chorus' && key !== 'Bridge' && key !== 'Verse') createLyricBlock(key, songObj[key], false);
            });

            let drawer = document.getElementById('mobileCategoryDrawer');
            if (drawer) drawer.classList.add('hidden');
        }

        function initBibleGridNav() {

        function syncBibleSettingsToUI() {
            bibleState.lang1 = document.getElementById('bibleLang1') ? document.getElementById('bibleLang1').value : bibleState.lang1;
            bibleState.lang2 = document.getElementById('bibleLang2') ? document.getElementById('bibleLang2').value : bibleState.lang2;
            bibleState.navLang = document.getElementById('bibleNavLang') ? document.getElementById('bibleNavLang').value : bibleState.navLang;
            bibleState.duration = parseInt(document.getElementById('bibleDuration') ? document.getElementById('bibleDuration').value : 0);
            bibleState.onlyReference = document.getElementById('bibleOnlyRef') ? document.getElementById('bibleOnlyRef').checked : false;
            renderBibleDrillDown();
        }

        function setBibleLevel(level) {
            bibleState.viewLevel = level;
            renderBibleDrillDown();
        }

        function handleNavLangChange(el) {
            bibleState.navLang = el.value;
            bibleState.viewLevel = 'books';
            renderBibleDrillDown();
        }

        function renderBibleDrillDown() {
            let container = document.getElementById('bibleDrilldownContainer');
            if (!container) return;
            container.innerHTML = '';

            let primaryDict = bibleData[bibleState.navLang] || bibleData.telugu;

            let headerHtml = `<div class="flex items-center gap-2 px-2 py-2 shrink-0 border-b border-gray-300 dark:border-[#333] mb-2">`;
            if (bibleState.viewLevel === 'books') {
                headerHtml += `<span class="font-bold text-gray-900 dark:text-white text-sm"><i class="fa-solid fa-book-open text-blue-500 mr-2"></i>Select Bible Book</span>`;
            } else if (bibleState.viewLevel === 'chapters') {
                let fullBookName = primaryDict[bibleState.book]?.name || bibleState.book;
                let shortBookName = getShortBookName(fullBookName);
                headerHtml += `
                    <button onclick="setBibleLevel('books')" class="px-2.5 py-1.5 bg-white hover:bg-gray-100 text-gray-800 dark:bg-[#333] dark:hover:bg-[#444] dark:text-white rounded text-[11px] font-bold transition flex items-center gap-1.5 shadow-sm border border-gray-300 dark:border-[#444]"><i class="fa-solid fa-book"></i> Books</button>
                    <span class="font-bold text-blue-600 dark:text-[#4488ff] text-[13px] ml-1 font-telugu"> ${shortBookName}</span>`;
            } else if (bibleState.viewLevel === 'verses') {
                let fullBookName = primaryDict[bibleState.book]?.name || bibleState.book;
                let shortBookName = getShortBookName(fullBookName);
                headerHtml += `
                    <button onclick="setBibleLevel('books')" class="px-2.5 py-1.5 bg-white hover:bg-gray-100 text-gray-800 dark:bg-[#333] dark:hover:bg-[#444] dark:text-white rounded text-[11px] font-bold transition flex items-center gap-1.5 shadow-sm border border-gray-300 dark:border-[#444]"><i class="fa-solid fa-book"></i> Books</button>
                    <button onclick="setBibleLevel('chapters')" class="px-2.5 py-1.5 bg-white hover:bg-gray-100 text-gray-800 dark:bg-[#333] dark:hover:bg-[#444] dark:text-white rounded text-[11px] font-bold transition flex items-center gap-1.5 shadow-sm border border-gray-300 dark:border-[#444]"><i class="fa-solid fa-arrow-left"></i> Chapters</button>
                    <span class="font-bold text-blue-600 dark:text-[#4488ff] text-[13px] ml-1 font-telugu"> ${shortBookName} ${bibleState.chapter}</span>`;
            }
            headerHtml += `</div>`;

            let previewBarHtml = '';
            if (bibleState.viewLevel === 'verses') {
                previewBarHtml = `
                    <div class="px-2 mb-3 shrink-0">
                        <div id="activeVersePreviewBox" class="px-3 py-2 bg-gray-100 text-gray-900 border border-gray-300 dark:bg-[#444] dark:text-white dark:border-[#333] rounded-lg text-[11px] truncate font-telugu shadow-inner">
                            <span class="truncate" id="previewVerseTextContent">${bibleState.lastSelectedVerseText}</span>
                        </div>
                    </div>`;
            }

            let gridHtml = document.createElement('div');
            gridHtml.className = "flex-1 overflow-y-auto w-full px-2";

            if (bibleState.viewLevel === 'books') {
                let grid = document.createElement('div');
                grid.className = "grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2.5 pb-4";
                Object.keys(primaryDict).forEach(bKey => {
                    let fullName = primaryDict[bKey].name || bKey;
                    let shortName = getShortBookName(fullName);

                    let btn = document.createElement('button');
                    btn.className = "grid-btn bg-white border border-gray-300 hover:bg-blue-50 text-gray-900 dark:bg-[#262626] dark:border-[#111] dark:hover:bg-[#444] dark:text-white font-telugu min-h-[50px] px-2 shadow-sm dark:shadow-none";
                    btn.title = fullName;
                    btn.textContent = shortName;
                    btn.onclick = () => {
                        bibleState.book = bKey;
                        setBibleLevel('chapters');
                    };
                    grid.appendChild(btn);
                });
                gridHtml.appendChild(grid);
            } 
            else if (bibleState.viewLevel === 'chapters') {
                let grid = document.createElement('div');
                grid.className = "grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-2.5 pb-4";
                let chaps = Object.keys(primaryDict[bibleState.book]?.chapters || { "1": {} });
                chaps.forEach(ch => {
                    let btn = document.createElement('button');
                    btn.className = "grid-btn bg-white border border-gray-300 hover:bg-blue-50 text-gray-900 dark:bg-[#262626] dark:border-[#111] dark:hover:bg-[#444] dark:text-white h-[48px] text-lg font-bold shadow-sm dark:shadow-none";
                    btn.textContent = ch;
                    btn.onclick = () => {
                        bibleState.chapter = ch;
                        setBibleLevel('verses');
                    };
                    grid.appendChild(btn);
                });
                gridHtml.appendChild(grid);
            }
            else if (bibleState.viewLevel === 'verses') {
                let grid = document.createElement('div');
                grid.className = "grid grid-cols-4 sm:grid-cols-5 md:grid-cols-8 lg:grid-cols-10 gap-1.5 pb-6";

                let chKey = bibleState.chapter;
                let navLang = bibleState.navLang;
                let l1Lang = bibleState.lang1;
                let l2Lang = bibleState.lang2;

                let navKeys = Object.keys(bibleData[navLang] || {});
                let l1Keys = Object.keys(bibleData[l1Lang] || {});
                let l2Keys = l2Lang !== 'none' ? Object.keys(bibleData[l2Lang] || {}) : [];
                let bookIndex = navKeys.indexOf(bibleState.book);

                let key1 = l1Keys[bookIndex] || bibleState.book;
                let key2 = l2Keys[bookIndex] || bibleState.book;

                let l1Dict = bibleData[l1Lang]?.[key1]?.chapters?.[chKey] || [];
                let l2Dict = l2Lang !== 'none' ? (bibleData[l2Lang]?.[key2]?.chapters?.[chKey] || []) : [];
                let navDict = bibleData[navLang]?.[bibleState.book] || { name: bibleState.book };

                let bookDisplayName = navDict.name || bibleState.book;
                let maxVerses = Math.max(l1Dict.length, l2Dict.length, 5);

                for (let i = 0; i < maxVerses; i++) {
                    let vNum = i + 1;
                    let text1 = (typeof l1Dict[i] === 'object' && l1Dict[i].text) ? l1Dict[i].text : (l1Dict[i] || `[Verse ${vNum} missing]`);
                    let text2 = l2Lang !== 'none' ? ((typeof l2Dict[i] === 'object' && l2Dict[i].text) ? l2Dict[i].text : (l2Dict[i] || '')) : '';
                    let refStr = `${bookDisplayName} ${chKey}:${vNum}`;

                    let isActive = (bibleState.lastSelectedVerseNum === vNum);
                    let bgClass = isActive 
                        ? "bg-blue-100 border-blue-400 text-blue-900 dark:bg-[#555] dark:border-[#777] dark:text-white" 
                        : "bg-white border-gray-300 hover:bg-gray-100 text-gray-800 dark:bg-[#262626] dark:border-[#111] dark:hover:bg-[#444] dark:text-white";

                    let tile = document.createElement('button');
                    tile.className = `bible-verse-tile h-12 ${bgClass} rounded-md font-bold text-sm flex items-center justify-center transition shadow-sm dark:shadow-none`;
                    tile.textContent = vNum;
                    tile.title = `${refStr}: ${text1.substring(0, 40)}...`;

                    let projContent = bibleState.onlyReference ? refStr : `${text1}${text2 ? '<br/>'+text2 : ''}<br/>(${refStr})`;
                    let previewStr = `${text1}${text2 ? ' | ' + text2 : ''}`;

                    tile.onclick = () => {
                        bibleState.lastSelectedVerseText = previewStr;
                        bibleState.lastSelectedVerseNum = vNum;
                        
                        let previewSpan = document.getElementById('previewVerseTextContent');
                        if (previewSpan) previewSpan.textContent = previewStr;

                        triggerProjection(projContent, null, null);
                        renderBibleDrillDown();
                        
                        if (window.verseTimeout) clearTimeout(window.verseTimeout);
                        if (bibleState.duration > 0) {
                            window.verseTimeout = setTimeout(() => { clearScreenMaster(); }, bibleState.duration * 1000);
                        }
                    };
                    grid.appendChild(tile);
                }
                gridHtml.appendChild(grid);
            }

            container.innerHTML = headerHtml + previewBarHtml;
            container.appendChild(gridHtml);
        }

        function handleSearch(input, suggId, listId, clearBtnId) {
            let query = input.value.trim().toLowerCase();
            let sugg = document.getElementById(suggId);
            let list = document.getElementById(listId);
            let clearBtn = document.getElementById(clearBtnId);

            if (query.length > 0) clearBtn.classList.remove('hidden');
            else { clearBtn.classList.add('hidden'); sugg.classList.add('hidden'); return; }

            let filtered = appSongs.filter(s => s.SongNumber.toString().includes(query) || (s.title && s.title.toLowerCase().includes(query)));
            list.innerHTML = '';

            if (filtered.length === 0) {
                list.innerHTML = `<li class="px-3 py-2 text-slate-400 italic text-xs">No matching songs</li>`;
            } else {
                filtered.forEach(s => {
                    let li = document.createElement('li');
                    li.className = "px-4 py-2.5 hover:bg-gray-100 dark:hover:bg-[#444] cursor-pointer flex justify-between text-gray-900 dark:text-white text-xs";
                    li.innerHTML = `<div><span class="font-bold text-blue-600 dark:text-[#4488ff] mr-2 font-sans">#${s.SongNumber}</span><span class="font-telugu">${s.title}</span></div>`;
                    li.onclick = () => {
                        loadSong(s.SongNumber);
                        sugg.classList.add('hidden');
                        input.value = '';
                        clearBtn.classList.add('hidden');
                    };
                    list.appendChild(li);
                });
            }
            sugg.classList.remove('hidden');
        }

        function getQHtml(q) {
            if (!q) return '';
            let h = q.root.innerHTML;
            return h === '<p><br></p>' ? '' : h.replace(/<p>/g, '').replace(/<\/p>/g, '<br/>').replace(/(<br\s*[\/]?>)+$/, '');
        }

        function setQHtml(q, h) {
            if (!q) return;
            if (!h) { q.setText(''); return; }
            q.root.innerHTML = h.split('<br/>').map(l => `<p>${l}</p>`).join('');
        }

            setQHtml(chorusQuill, activeSong.Song.Chorus || '');
            setQHtml(bridgeQuill, activeSong.Song.Bridge || '');

            toggleModal('songModal', true);

        function addStanzaRow(txt = '') {
            let container = document.getElementById('stanzasContainer');
            let editorId = 'stz_' + Date.now();
            let card = document.createElement('div');
            card.className = 'stanza-card bg-slate-50 dark:bg-slate-800 p-3 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-2';
            card.innerHTML = `<div class="flex items-center justify-between text-xs font-bold text-slate-500"><span class="stanza-label">Stanza</span><div><button onclick="this.closest('.stanza-card').remove()" class="text-red-500 hover:text-red-700 p-1"><i class="fa-solid fa-trash"></i></button></div></div><div id="${editorId}"></div>`;
            container.appendChild(card);
            let q = new Quill('#' + editorId, { theme: 'snow', modules: { toolbar: quillToolbarOptions } });
            setQHtml(q, txt);
            stanzaQuills.push({ id: editorId, instance: q, card: card });
        }

        function saveSongForm() {
            let id = document.getElementById('editSongId').value;
            let num = parseInt(document.getElementById('inputSongNum').value);
            let title = document.getElementById('inputTitle').value.trim();
            if (!num || !title) return alert("Number and Title are required.");

            let songObj = {};
            let c = getQHtml(chorusQuill); if (c) songObj.Chorus = c;
            let b = getQHtml(bridgeQuill); if (b) songObj.Bridge = b;

            let i = 1;
            document.querySelectorAll('.stanza-card').forEach(card => {
                let sq = stanzaQuills.find(q => q.card === card);
                if (sq) {
                    let t = getQHtml(sq.instance);
                    if (t) { songObj[i.toString()] = t; i++; }
                }
            });

            let newSongData = {
                id: id || Date.now(),
                SongNumber: num,
                title: title,
                categoryId: document.getElementById('inputCategory').value,
                Song: songObj
            };

            let existingIdx = appSongs.findIndex(s => s.id == id || s.SongNumber == num);
            if (existingIdx >= 0) appSongs[existingIdx] = newSongData;
            else appSongs.push(newSongData);

            db.collection("song_databases").doc(currentSessionId).set({ customSongs: appSongs }, { merge: true });
            renderAccordionCategories();
            toggleModal('songModal', false);
            loadSong(num);
        }
    </script>
</head>

                    <div class="flex gap-2">
                        <input type="text" id="roomCodeInput" class="flex-1 border dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg px-3 py-2 text-sm font-mono font-bold">
                        <button onclick="joinRoom()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 rounded-lg text-xs font-bold">Join</button>
                    </div>
                </div>
                <div class="bg-slate-50 dark:bg-slate-900/40 p-3 rounded-xl border border-slate-200 dark:border-slate-800">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-bold text-slate-600 dark:text-slate-400">OBS Native WebSocket</label>
                        <span id="obsStatusBadge" class="text-[10px] font-bold px-2 py-1 bg-slate-200 dark:bg-slate-800 rounded text-slate-500 dark:text-slate-400">Disconnected</span>
                    </div>
                    <div class="space-y-2">
                        <input type="text" id="obsUrl" value="ws://127.0.0.1:4455" class="w-full border dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg px-3 py-2 text-sm font-mono">
                        <div class="flex gap-2">
                            <input type="text" id="obsSourceName" value="Lyrics" class="flex-1 border dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg px-3 py-2 text-sm">
                            <input type="password" id="obsPassword" placeholder="WS Password" class="flex-1 border dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg px-3 py-2 text-sm">
                        </div>
                        <button onclick="connectOBS()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-lg text-sm font-bold shadow-md">Connect to OBS Studio</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: CANVAS STYLE OPTIONS -->
    <div id="obsSettingsModal" class="fixed inset-0 bg-slate-950/60 z-50 hidden flex items-center justify-center p-4">
        <div class="glass-modal rounded-2xl w-full max-w-lg flex flex-col overflow-hidden text-slate-900 dark:text-slate-100 shadow-2xl">
            <div class="px-5 py-3 border-b border-slate-200 dark:border-slate-800 bg-blue-50 dark:bg-slate-900 flex justify-between items-center">
                <h3 class="font-bold text-sm"><i class="fa-solid fa-sliders text-blue-600 dark:text-blue-400 mr-2"></i>Canvas Style Options</h3>
                <button onclick="toggleModal('obsSettingsModal',false)"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-5 space-y-4 max-h-[70vh] overflow-y-auto text-xs">
                <div>
                    <div class="flex justify-between mb-1"><label class="font-bold">Font Size</label><span id="fontSizeVal" class="text-blue-600 dark:text-blue-400 font-bold">4.0vw</span></div>
                    <input type="range" id="obsFontSize" min="1.5" max="8.0" step="0.2" value="4.0" oninput="applyDesktopStylesFromModal()" class="w-full">
                </div>
                <div>
                    <label class="block font-bold mb-1">Font Family</label>
                    <select id="obsFontFamily" onchange="applyDesktopStylesFromModal()" class="w-full border dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded p-2">
                        <option value="'Mandali', sans-serif">Mandali</option>
                        <option value="'Gidugu', sans-serif">Gidugu</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-bold mb-1">Text Color</label>
                        <input type="color" id="obsTextColor" value="#ffffff" onchange="applyDesktopStylesFromModal()" class="w-full h-8 rounded border dark:border-slate-700 p-0.5 bg-transparent cursor-pointer">
                    </div>
                    <div>
                        <label class="block font-bold mb-1">Background (Chroma)</label>
                        <input type="color" id="obsBgColor" value="#008000" onchange="applyDesktopStylesFromModal()" class="w-full h-8 rounded border dark:border-slate-700 p-0.5 bg-transparent cursor-pointer">
                    </div>
                </div>
                <div>
                    <label class="block font-bold mb-1">Bg Image URL (Leave empty for transparent)</label>
                    <div class="flex gap-2">
                        <input type="text" id="obsBgImage" placeholder="Image URL..." oninput="applyDesktopStylesFromModal()" class="w-full border dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded p-2">
                        <button onclick="clearBgImageInput('obsBgImage')" class="px-3 bg-slate-200 dark:bg-slate-700 font-bold rounded text-slate-800 dark:text-slate-200">Clear</button>
                    </div>
                </div>
                <div class="flex items-center justify-between p-2 bg-blue-50 dark:bg-slate-900 rounded border border-blue-100 dark:border-slate-800">
                    <label class="font-bold">Text Shadow</label>
                    <input type="checkbox" id="obsTextShadow" checked onchange="applyDesktopStylesFromModal()" class="w-4 h-4">
                </div>
                <div class="flex items-center justify-between p-2 bg-blue-50 dark:bg-slate-900 rounded border border-blue-100 dark:border-slate-800">
                    <label class="font-bold">Hide Verse Tags (Pipes)</label>
                    <input type="checkbox" id="obsHidePipesText" onchange="applyDesktopStylesFromModal()" class="w-4 h-4">
                </div>
            </div>
            <div class="px-5 py-3 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 flex justify-end">
                <button onclick="toggleModal('obsSettingsModal',false)" class="bg-blue-600 text-white px-4 py-1.5 rounded-lg text-sm font-bold">Done</button>
            </div>
        </div>
    </div>

    <!-- MODAL: ADD/EDIT SONG -->
    <div id="songModal" class="fixed inset-0 bg-slate-950/60 z-50 hidden flex items-center justify-center p-4">
        <div class="glass-modal rounded-2xl w-full max-w-3xl flex flex-col overflow-hidden text-slate-900 dark:text-slate-100 shadow-2xl h-[90vh]">
            <div class="px-5 py-3 border-b border-slate-200 dark:border-slate-800 bg-blue-50 dark:bg-slate-900 flex justify-between items-center">
                <h3 id="modalHeaderTitle" class="font-bold text-sm"></h3>
                <button onclick="toggleModal('songModal',false)"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-5 overflow-y-auto space-y-4 flex-1">
                <input type="hidden" id="editSongId">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold mb-1">Number</label>
                        <input type="number" id="inputSongNum" class="w-full border dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">Category</label>
                        <select id="inputCategory" class="w-full border dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg p-2 text-sm"></select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">Title</label>
                    <input type="text" id="inputTitle" class="w-full border dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg p-2 text-sm">
                </div>
                <div class="bg-amber-50 dark:bg-amber-950/30 p-3 border border-amber-200 dark:border-amber-900/50 rounded-xl space-y-2">
                    <label class="block text-xs font-bold text-amber-900 dark:text-amber-200">Chorus</label>
                    <div id="inputChorusEditor" class="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100"></div>
                </div>
                <div class="bg-purple-50 dark:bg-purple-950/30 p-3 border border-purple-200 dark:border-purple-900/50 rounded-xl space-y-2">
                    <label class="block text-xs font-bold text-purple-900 dark:text-purple-200">Bridge</label>
                    <div id="inputBridgeEditor" class="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100"></div>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-bold">Stanzas</label>
                        <button onclick="addStanzaRow()" class="text-xs text-blue-600 dark:text-blue-400 font-bold">+ Add</button>
                    </div>
                    <div id="stanzasContainer" class="space-y-3"></div>
                </div>
            </div>
            <div class="px-5 py-3 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 flex justify-between">
                <button id="deleteSongBtn" class="text-red-600 text-xs font-bold hidden">Delete</button>
                <div class="flex gap-2 ml-auto">
                    <button onclick="toggleModal('songModal',false)" class="px-4 py-2 text-slate-600 dark:text-slate-400 text-xs font-bold">Cancel</button>
                    <button onclick="saveSongForm()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold">Save</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
