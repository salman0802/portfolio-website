<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jubal Studio | Cyber-Sacred Workstation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/tone"></script>
    <script src="https://unpkg.com/@tonejs/midi"></script>
    
    <style>
        :root { 
            --bg-base: #030508; 
            --bg-panel: rgba(10, 14, 23, 0.75); 
            --bg-elevated: rgba(20, 27, 43, 0.85);
            --border-color: rgba(0, 240, 255, 0.15); 
            --border-hover: rgba(0, 240, 255, 0.4);
            --text-main: #f0f6fc; 
            --text-muted: #8b949e; 
            --accent-gold: #ffd700; 
            --accent-cyan: #00f0ff; 
            --accent-glow: rgba(0, 240, 255, 0.25);
            --gold-glow: rgba(255, 215, 0, 0.3);
            --danger: #ff3366; 
            --success: #00ff66;
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        body { font-family: var(--font-body); background: var(--bg-base); color: var(--text-main); margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; background-image: radial-gradient(circle at 50% 0%, #0c152a 0%, #030508 70%); }
        
        /* Futuristic Glass Header */
        header { background: var(--bg-panel); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-color); height: 70px; padding: 0 35px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; box-shadow: 0 8px 32px rgba(0,0,0,0.6); z-index: 50; }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand-icon { font-size: 1.4rem; filter: drop-shadow(0 0 10px var(--accent-gold)); }
        header h2 { margin: 0; font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; background: linear-gradient(135deg, var(--text-main) 30%, var(--accent-gold) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Navigation Tabs */
        .nav-tabs { display: flex; gap: 6px; background: rgba(3, 5, 8, 0.6); padding: 5px; border-radius: 10px; border: 1px solid var(--border-color); backdrop-filter: blur(8px); }
        .tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 8px 18px; border-radius: 6px; cursor: pointer; font-family: var(--font-display); font-size: 0.72rem; letter-spacing: 1px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .tab-btn:hover { color: var(--text-main); text-shadow: 0 0 8px var(--accent-cyan); }
        .tab-btn.active { background: var(--bg-elevated); color: var(--accent-cyan); border: 1px solid var(--border-hover); box-shadow: 0 0 15px var(--accent-glow); font-weight: 700; }

        .header-right { display: flex; align-items: center; gap: 16px; }
        .midi-status { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 0.65rem; letter-spacing: 1px; color: var(--text-muted); background: rgba(3, 5, 8, 0.5); padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color); }
        .midi-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); transition: 0.3s; }
        .midi-dot.active { background: var(--success); box-shadow: 0 0 12px var(--success); }

        .view-section { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box; }
        .view-section.active { display: flex; }

        /* Futuristic UI Controls & Glass Panels */
        button { background: var(--bg-elevated); color: var(--text-main); border: 1px solid var(--border-color); padding: 10px 20px; cursor: pointer; border-radius: 8px; font-family: var(--font-display); font-size: 0.72rem; letter-spacing: 1px; transition: all 0.25s ease; display: inline-flex; align-items: center; gap: 8px; backdrop-filter: blur(8px); }
        button:hover:not(:disabled) { background: rgba(0, 240, 255, 0.1); border-color: var(--accent-cyan); box-shadow: 0 0 12px var(--accent-glow); color: var(--accent-cyan); }
        button.primary { background: linear-gradient(135deg, rgba(0,240,255,0.2), rgba(255,215,0,0.2)); border-color: var(--accent-gold); color: var(--accent-gold); font-weight: 700; }
        button.primary:hover:not(:disabled) { background: linear-gradient(135deg, rgba(0,240,255,0.35), rgba(255,215,0,0.35)); box-shadow: 0 0 20px var(--gold-glow); color: #fff; }
        button.danger { border-color: rgba(255, 51, 102, 0.4); color: var(--danger); }
        button.danger:hover:not(:disabled) { background: rgba(255, 51, 102, 0.2); box-shadow: 0 0 15px rgba(255, 51, 102, 0.4); color: #fff; }
        button.recording { background: var(--danger) !important; color: #fff !important; animation: pulse-rec 1.5s infinite; border-color: #fff; }
        @keyframes pulse-rec { 0% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0.8); } 70% { box-shadow: 0 0 0 12px rgba(255, 51, 102, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0); } }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        select, input[type="number"], input[type="range"] { background: rgba(3, 5, 8, 0.8); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 12px; border-radius: 6px; outline: none; font-family: var(--font-body); font-size: 0.82rem; transition: all 0.2s; backdrop-filter: blur(4px); }
        select:focus, input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 10px var(--accent-glow); }

        .panel-card { background: var(--bg-panel); backdrop-filter: blur(20px); border: 1px solid var(--border-color); border-radius: 16px; padding: 30px; width: 100%; max-width: 720px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); display: flex; flex-direction: column; gap: 20px; box-sizing: border-box; }
        .control-group { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
        .control-group label { font-family: var(--font-display); font-size: 0.65rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }

        .note-display { font-family: var(--font-display); font-size: 2.8rem; font-weight: 900; color: var(--accent-cyan); letter-spacing: 3px; margin-bottom: 8px; height: 55px; text-shadow: 0 0 20px var(--accent-glow); text-align: center; }

        /* Modal MIDI Editor */
        .modal-overlay { position: fixed; inset: 0; background: rgba(3, 5, 8, 0.88); backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-card { background: var(--bg-panel); backdrop-filter: blur(24px); border: 1px solid var(--border-hover); border-radius: 18px; width: 92%; max-width: 980px; padding: 32px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box; box-shadow: 0 30px 60px rgba(0,0,0,0.9); }
        
        .piano-roll-viewport { width: 100%; height: 440px; background: #020305; border: 1px solid var(--border-color); border-radius: 10px; position: relative; overflow: auto; user-select: none; }
        .piano-roll-canvas-content { position: relative; width: 1600px; height: 1280px; background-image: linear-gradient(to bottom, rgba(0, 240, 255, 0.03) 1px, transparent 1px); background-size: 100% 12px; }
        
        .roll-note { position: absolute; background: linear-gradient(135deg, var(--accent-cyan), #0077ff); border-radius: 4px; border: 1px solid rgba(255,255,255,0.4); opacity: 0.92; cursor: grab; display: flex; align-items: center; padding-left: 6px; font-family: var(--font-display); font-size: 0.6rem; color: #030508; font-weight: 700; overflow: hidden; white-space: nowrap; box-shadow: 0 0 10px rgba(0,240,255,0.3); }
        .roll-note:active { cursor: grabbing; }
        .roll-note .resize-handle { position: absolute; right: 0; top: 0; width: 6px; height: 100%; cursor: ew-resize; background: rgba(255,255,255,0.6); }

        .timeline-track { width: 100%; height: 50px; background: rgba(3, 5, 8, 0.8); border: 1px solid var(--border-color); border-radius: 10px; position: relative; cursor: crosshair; overflow: hidden; }
        .timeline-progress { position: absolute; top: 0; left: 0; height: 100%; background: rgba(0, 240, 255, 0.15); pointer-events: none; border-right: 2px solid var(--accent-cyan); }
        .timeline-loop-region { position: absolute; top: 0; height: 100%; background: rgba(255, 215, 0, 0.2); border-left: 2px dashed var(--accent-gold); border-right: 2px dashed var(--accent-gold); pointer-events: none; }

        /* Keyboards & Visualizers */
        .keyboard { display: flex; position: relative; height: 180px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); border-radius: 8px; overflow: hidden; margin-top: 15px; background: #030508; border: 1px solid var(--border-color); }
        .key { transition: transform 0.05s, background 0.05s, box-shadow 0.05s; box-sizing: border-box; }
        .key.white { width: 42px; height: 180px; background: linear-gradient(to bottom, #e2e8f0, #cbd5e1); border: 1px solid #94a3b8; z-index: 1; margin-right: -1px; }
        .key.black { width: 25px; height: 105px; background: linear-gradient(to bottom, #1e293b, #0f172a); border: 1px solid #000; position: absolute; z-index: 2; margin-left: -12.5px; border-radius: 0 0 4px 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        .key.white.active { background: linear-gradient(to bottom, #bae6fd, var(--accent-cyan)) !important; border-color: var(--accent-cyan); box-shadow: inset 0 -12px 20px var(--accent-glow); }
        .key.black.active { background: var(--accent-cyan) !important; box-shadow: 0 0 15px var(--accent-cyan); }

        .wind-container { position: relative; width: 460px; height: 150px; display: flex; align-items: center; justify-content: center; margin-top: 15px; }
        .rotated-wrapper { position: relative; height: 520px; width: 95px; transform: rotate(-90deg); transform-origin: center center; display: flex; justify-content: center; filter: drop-shadow(0 0 25px rgba(0,240,255,0.25)); }
        .hole-overlay { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: transparent; border: 2px solid transparent; transform: translate(-50%, -50%); z-index: 10; display: none; }
        .hole-overlay.small { width: 10px; height: 10px; }
        .hole-overlay.thumb { border-style: dashed; border-color: rgba(0,240,255,0.5); }
        .hole-overlay.active-hole { display: block; }
        .hole-overlay.covered { background: var(--accent-cyan); border-color: #fff; box-shadow: 0 0 16px var(--accent-cyan); }

        #rec-0 { top: 35%; left: 0%; } #rec-1 { top: 43.5%; left: 50%; } #rec-2 { top: 51%; left: 50%; } #rec-3 { top: 57.5%; left: 50%; }
        #rec-4 { top: 67%; left: 50%; } #rec-5 { top: 73.5%; left: 50%; } #rec-6a{ top: 80%; left: 42%; } #rec-6b{ top: 80%; left: 58%; }
        #rec-7a{ top: 86.5%; left: 44%; } #rec-7b{ top: 86.5%; left: 56%; }
        #ban-1 { top: 40%; left: 50%; } #ban-2 { top: 48%; left: 50%; } #ban-3 { top: 56%; left: 50%; } #ban-4 { top: 68%; left: 50%; } #ban-5 { top: 76%; left: 50%; } #ban-6 { top: 84%; left: 50%; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span class="brand-icon">⚡</span>
            <h2>Jubal Studio</h2>
        </div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchView('live')">Live Matrix & Pads</button>
            <button class="tab-btn" onclick="switchView('learning')">Cyber Track Player</button>
        </div>
        <div class="header-right">
            <div class="midi-status">
                <div class="midi-dot" id="midi-dot"></div>
                <span id="midi-text">Hardware MIDI: Offline</span>
            </div>
        </div>
    </header>

    <!-- VIEW 1: LIVE PERFORMANCE -->
    <section id="view-live" class="view-section active">
        <div class="note-display" id="live-note">--</div>
        
        <div class="panel-card" style="max-width: 580px; align-items: center;">
            <div style="display: flex; gap: 12px; width: 100%;">
                <button id="btn-record" class="danger" style="flex: 1; justify-content: center;">🔴 Record Matrix</button>
                <button id="btn-open-editor" style="flex: 1; justify-content: center;" disabled>🎛️ Piano Roll</button>
                <button id="btn-save" class="primary" style="flex: 1; justify-content: center;" disabled>💾 Export MIDI</button>
            </div>
            
            <div style="display: flex; gap: 12px; width: 100%;">
                <button id="btn-play-rec" class="primary" style="flex: 1; justify-content: center;" disabled>▶ Play Sequence</button>
                <button id="btn-stop-rec" class="danger" style="flex: 1; justify-content: center;" disabled>■ Stop Playback</button>
            </div>

            <div class="control-group" style="width: 100%;">
                <label>Import MIDI Stream</label>
                <input type="file" id="live-file-input" accept=".mid,.midi" style="width: 240px;">
            </div>

            <div class="control-group" style="width: 100%;">
                <label>Neural Voice Engine</label>
                <select id="live-voice" style="width: 240px;">
                    <option value="grand">Sanctuary Grand Piano</option>
                    <option value="warm-ep">Warm Rhodes Electric Piano</option>
                    <option value="bansuri">Cyber Bansuri Flute</option>
                    <option value="recorder">Master Wood Recorder</option>
                </select>
            </div>

            <div class="control-group" style="width: 100%;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="metronome-toggle" style="accent-color: var(--accent-cyan); width: 16px; height: 16px;">
                    <label style="margin: 0; cursor: pointer; color: var(--text-main);">Quantum Metronome</label>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <label>Tempo: <span id="live-tempo-val" style="color: var(--accent-cyan);">120</span> BPM</label>
                    <input type="range" id="live-tempo" min="40" max="200" value="120" style="width: 120px;">
                </div>
            </div>
        </div>

        <div style="margin-top: 30px;"><div class="keyboard" id="live-keyboard"></div></div>
    </section>

    <!-- VIEW 2: TRACK PLAYER & LEARNING -->
    <section id="view-learning" class="view-section">
        <div class="note-display" id="learn-note">--</div>

        <div class="panel-card" style="max-width: 680px; margin-bottom: 20px;">
            <div class="control-group">
                <label>Load Sequence File</label>
                <div style="display: flex; gap: 10px;">
                    <input type="file" id="file-input" accept=".mid,.midi" style="width: 220px;">
                    <button id="btn-open-file-editor" style="padding: 6px 14px;" disabled>🎛️ Edit Sequence</button>
                </div>
            </div>
            
            <div class="control-group" style="flex-direction: column; align-items: stretch; gap: 6px;">
                <label>Waveform Telemetry Timeline (Drag to Loop Region)</label>
                <div class="timeline-track" id="timeline-track">
                    <div class="timeline-progress" id="timeline-progress" style="width: 0%;"></div>
                    <div class="timeline-loop-region" id="timeline-loop-region" style="left: 0%; width: 100%; display: none;"></div>
                </div>
            </div>

            <div class="control-group">
                <label>Instrument Visualizer & Voice</label>
                <select id="learn-instrument" style="width: 280px;">
                    <option value="piano">Grand Piano (Keys)</option>
                    <option value="recorder">Alto Recorder (Fingering)</option>
                    <option value="bansuri">Indian Flute (Bansuri)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Master Tempo (<span id="learn-tempo-val" style="color: var(--accent-cyan);">120</span> BPM)</label>
                <input type="range" id="learn-tempo" min="30" max="240" value="120" style="width: 280px;">
            </div>
            
            <div style="display: flex; gap: 12px; margin-top: 6px;">
                <button id="btn-file-play" class="primary" style="flex: 1; justify-content: center; padding: 11px;" disabled>▶ Engage Playback</button>
                <button id="btn-file-stop" class="danger" style="flex: 1; justify-content: center; padding: 11px;" disabled>■ Abort Playback</button>
            </div>
        </div>

        <div style="width: 100%; display: flex; justify-content: center;">
            <div class="keyboard" id="learn-keyboard" style="display: none;"></div>
            <div class="wind-container" id="learn-wind-container" style="display: flex;">
                <div class="rotated-wrapper">
                    <svg id="svg-recorder" viewBox="0 0 100 600" width="100%" height="100%">
                        <defs><linearGradient id="w" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#05101a"/><stop offset="25%" stop-color="#0b2038"/><stop offset="50%" stop-color="#071626"/><stop offset="85%" stop-color="#030b14"/><stop offset="100%" stop-color="#010408"/></linearGradient><linearGradient id="h" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#020305"/><stop offset="100%" stop-color="#0f172a"/></linearGradient></defs>
                        <path d="M 35,5 L 65,5 L 75,60 L 25,60 Z" fill="url(#w)"/><path d="M 40,5 C 50,-5 60,5 60,5" fill="#010408" /><rect x="42" y="35" width="16" height="12" rx="3" fill="#000" stroke="#00f0ff" stroke-width="0.5"/><rect x="25" y="60" width="50" height="20" fill="#030b14"/><rect x="26" y="80" width="48" height="300" fill="url(#w)"/><rect x="22" y="75" width="56" height="6" rx="2" fill="#010408"/><rect x="25" y="380" width="50" height="15" fill="#030b14"/><rect x="26" y="395" width="48" height="135" fill="url(#w)"/><rect x="22" y="390" width="56" height="6" rx="2" fill="#010408"/><path d="M 26,530 L 74,530 L 82,590 L 18,590 Z" fill="url(#w)"/><path d="M 18,590 C 50,600 82,590 82,590" fill="#010408" /><rect x="20" y="525" width="60" height="8" rx="2" fill="#010408"/>
                        <circle cx="50" cy="261" r="7" fill="url(#h)"/><circle cx="50" cy="306" r="7" fill="url(#h)"/><circle cx="50" cy="345" r="7" fill="url(#h)"/><circle cx="50" cy="402" r="7" fill="url(#h)"/><circle cx="50" cy="441" r="7" fill="url(#h)"/><circle cx="42" cy="480" r="4" fill="url(#h)"/><circle cx="58" cy="480" r="4" fill="url(#h)"/><circle cx="44" cy="519" r="4" fill="url(#h)"/><circle cx="56" cy="519" r="4" fill="url(#h)"/>
                    </svg>
                    <svg id="svg-bansuri" viewBox="0 0 100 600" width="100%" height="100%" style="display: none;">
                        <defs><linearGradient id="b" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#2d2208"/><stop offset="25%" stop-color="#ffd700"/><stop offset="50%" stop-color="#c59b27"/><stop offset="85%" stop-color="#40320a"/><stop offset="100%" stop-color="#140f02"/></linearGradient></defs>
                        <rect x="30" y="10" width="40" height="580" rx="3" fill="url(#b)"/><rect x="28" y="40" width="44" height="4" fill="#00f0ff"/><rect x="28" y="160" width="44" height="4" fill="#00f0ff"/><rect x="28" y="320" width="44" height="4" fill="#00f0ff"/><rect x="28" y="550" width="44" height="4" fill="#00f0ff"/><ellipse cx="50" cy="90" rx="7" ry="9" fill="#030508"/>
                        <circle cx="50" cy="240" r="7" fill="#030508"/><circle cx="50" cy="288" r="7" fill="#030508"/><circle cx="50" cy="336" r="7" fill="#030508"/><circle cx="50" cy="408" r="7" fill="#030508"/><circle cx="50" cy="456" r="7" fill="#030508"/><circle cx="50" cy="504" r="7" fill="#030508"/>
                    </svg>
                    <div class="hole-overlay thumb rec-hole" id="rec-0"></div><div class="hole-overlay rec-hole" id="rec-1"></div><div class="hole-overlay rec-hole" id="rec-2"></div><div class="hole-overlay rec-hole" id="rec-3"></div><div class="hole-overlay rec-hole" id="rec-4"></div><div class="hole-overlay rec-hole" id="rec-5"></div><div class="hole-overlay small rec-hole" id="rec-6a"></div><div class="hole-overlay small rec-hole" id="rec-6b"></div><div class="hole-overlay small rec-hole" id="rec-7a"></div><div class="hole-overlay small rec-hole" id="rec-7b"></div>
                    <div class="hole-overlay ban-hole" id="ban-1"></div><div class="hole-overlay ban-hole" id="ban-2"></div><div class="hole-overlay ban-hole" id="ban-3"></div><div class="hole-overlay ban-hole" id="ban-4"></div><div class="hole-overlay ban-hole" id="ban-5"></div><div class="hole-overlay ban-hole" id="ban-6"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- MODAL: MIDI EDITOR -->
    <div class="modal-overlay" id="editor-modal">
        <div class="modal-card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; font-family: var(--font-display); font-size: 1.1rem; color: var(--accent-cyan); letter-spacing: 1px;" id="editor-title">Neural Piano Roll Editor</h3>
                <button onclick="closeEditor()" style="padding: 5px 14px;">✕ Close & Sync</button>
            </div>
            
            <div class="piano-roll-viewport" id="roll-viewport">
                <div class="piano-roll-canvas-content" id="roll-canvas-content"></div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 0.75rem; color: var(--text-muted);">💡 Drag notes vertically for pitch modulation, horizontally for time shifts, or grab the right edge for duration stretching.</span>
                <button class="primary" onclick="closeEditor()">Apply & Close</button>
            </div>
        </div>
    </div>

    <script>
        Tone.context.lookAhead = 0.005;

        const voices = {
            'grand': new Tone.PolySynth(Tone.Synth, { oscillator: { type: "sine" }, envelope: { attack: 0.005, decay: 2.5, sustain: 0.1, release: 1.2 } }).toDestination(),
            'warm-ep': new Tone.PolySynth(Tone.FMSynth, { harmonicity: 1.0, modulationIndex: 2.0, oscillator: { type: "triangle" }, envelope: { attack: 0.01, decay: 2.0, sustain: 0.3, release: 0.8 } }).toDestination(),
            'bansuri': new Tone.PolySynth(Tone.AMSynth, { harmonicity: 1.5, oscillator: { type: "sine" }, envelope: { attack: 0.15, decay: 0.3, sustain: 0.8, release: 0.6 } }).toDestination(),
            'recorder': new Tone.PolySynth(Tone.Synth, { oscillator: { type: "triangle" }, envelope: { attack: 0.04, decay: 0.1, sustain: 0.9, release: 0.2 } }).toDestination()
        };
        let activeLiveVoice = voices['grand'];
        let activeLearnVoice = voices['grand'];

        const drumKit = {
            36: new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 4, oscillator: { type: 'sine' }, envelope: { attack: 0.001, decay: 0.4 } }).toDestination(),
            37: new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.2 } }).toDestination(),
            38: new Tone.MetalSynth({ frequency: 200, envelope: { attack: 0.001, decay: 0.1, release: 0.05 } }).toDestination(),
            39: new Tone.MetalSynth({ frequency: 200, envelope: { attack: 0.001, decay: 0.4, release: 0.2 } }).toDestination(),
            40: new Tone.Synth({ oscillator: { type: 'square' }, envelope: { attack: 0.001, decay: 0.15 } }).toDestination(),
            41: new Tone.MonoSynth({ oscillator: { type: 'triangle' }, envelope: { attack: 0.005, decay: 0.3 } }).toDestination(),
            42: new Tone.MonoSynth({ oscillator: { type: 'sine' }, envelope: { attack: 0.005, decay: 0.3 } }).toDestination(),
            43: new Tone.MembraneSynth({ pitchDecay: 0.01, octaves: 2, envelope: { attack: 0.001, decay: 0.2 } }).toDestination()
        };

        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            if (viewName === 'live') {
                document.getElementById('view-live').classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                document.getElementById('view-learning').classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
            }
        }

        const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        function buildKeyboard(containerId) {
            const container = document.getElementById(containerId);
            let whiteCount = 0;
            for (let octave = 3; octave <= 5; octave++) {
                notes.forEach(note => {
                    const isBlack = note.includes('#');
                    const key = document.createElement('div');
                    key.className = `key ${isBlack ? 'black' : 'white'}`;
                    key.id = `${containerId}-${note}${octave}`;
                    if (isBlack) key.style.left = `${whiteCount * 42}px`; else whiteCount++;
                    container.appendChild(key);
                });
            }
        }
        buildKeyboard('live-keyboard');
        buildKeyboard('learn-keyboard');

        document.getElementById('live-voice').addEventListener('change', (e) => { activeLiveVoice = voices[e.target.value]; });

        const recorderFingering = { 'C': [0, 1, 2, 3, 4, 5, '6a', '6b', '7a', '7b'], 'D': [0, 1, 2, 3, 4, 5, '6a', '6b'], 'E': [0, 1, 2, 3, 4, 5], 'F': [0, 1, 2, 3, 4, '6a', '6b', '7a', '7b'], 'G': [0, 1, 2, 3], 'A': [0, 1, 2], 'B': [0, 1], 'C#': [0, 1, 2, 4, 5], 'F#': [0, 1, 2, 3, 5, '6a', '6b'] };
        const bansuriFingering = { 'C': [1, 2, 3, 4, 5, 6], 'D': [1, 2, 3, 4, 5], 'E': [1, 2, 3, 4], 'F': [1, 2, 3], 'G': [1, 2], 'A': [1], 'B': [], 'C#': [1, 2, 3, 4, 6], 'F#': [1, 2, 4, 5] };

        const learnInstrumentSelect = document.getElementById('learn-instrument');
        learnInstrumentSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            document.querySelectorAll('.hole-overlay').forEach(el => el.classList.remove('active-hole', 'covered'));
            if (val === 'bansuri') {
                activeLearnVoice = voices['bansuri'];
                document.getElementById('learn-keyboard').style.display = 'none';
                document.getElementById('learn-wind-container').style.display = 'flex';
                document.getElementById('svg-recorder').style.display = 'none';
                document.getElementById('svg-bansuri').style.display = 'block';
                document.querySelectorAll('.ban-hole').forEach(el => el.classList.add('active-hole'));
            } else if (val === 'recorder') {
                activeLearnVoice = voices['recorder'];
                document.getElementById('learn-keyboard').style.display = 'none';
                document.getElementById('learn-wind-container').style.display = 'flex';
                document.getElementById('svg-bansuri').style.display = 'none';
                document.getElementById('svg-recorder').style.display = 'block';
                document.querySelectorAll('.rec-hole').forEach(el => el.classList.add('active-hole'));
            } else {
                activeLearnVoice = voices['grand'];
                document.getElementById('learn-keyboard').style.display = 'flex';
                document.getElementById('learn-wind-container').style.display = 'none';
            }
        });
        learnInstrumentSelect.dispatchEvent(new Event('change'));

        let activeLiveNotes = new Set();
        let activeLearnNotes = new Set();

        function updateVisuals(isLive = false) {
            const notesSet = isLive ? activeLiveNotes : activeLearnNotes;
            const noteDisplay = isLive ? document.getElementById('live-note') : document.getElementById('learn-note');
            
            if (notesSet.size === 0) {
                noteDisplay.innerText = '--';
            } else {
                noteDisplay.innerText = Array.from(notesSet).join(' + ');
            }

            if (isLive) {
                document.querySelectorAll('#live-keyboard .key.active').forEach(k => k.classList.remove('active'));
                notesSet.forEach(n => {
                    const k = document.getElementById(`live-keyboard-${n}`);
                    if (k) k.classList.add('active');
                });
            } else {
                const inst = learnInstrumentSelect.value;
                if (inst === 'piano') {
                    document.querySelectorAll('#learn-keyboard .key.active').forEach(k => k.classList.remove('active'));
                    notesSet.forEach(n => {
                        const k = document.getElementById(`learn-keyboard-${n}`);
                        if (k) k.classList.add('active');
                    });
                } else {
                    document.querySelectorAll('.hole-overlay.covered').forEach(el => el.classList.remove('covered'));
                    if (notesSet.size > 0) {
                        const latestNote = Array.from(notesSet)[notesSet.size - 1];
                        const prefix = inst === 'bansuri' ? 'ban' : 'rec';
                        const chart = inst === 'bansuri' ? bansuriFingering : recorderFingering;
                        const base = latestNote.replace(/[0-9]/g, '');
                        const holes = chart[base];
                        if (holes) holes.forEach(h => { const el = document.getElementById(`${prefix}-${h}`); if (el) el.classList.add('covered'); });
                    }
                }
            }
        }

        // --- Shared Piano Roll Editor Engine ---
        let currentEditingTarget = null; 
        let importedEditableNotes = [];
        const editorModal = document.getElementById('editor-modal');
        const editorTitle = document.getElementById('editor-title');

        document.getElementById('btn-open-editor').addEventListener('click', () => {
            currentEditingTarget = 'recorded';
            editorTitle.innerText = "Neural Piano Roll Editor (Live Matrix)";
            renderPianoRoll(recNotes);
            editorModal.style.display = 'flex';
        });

        document.getElementById('btn-open-file-editor').addEventListener('click', () => {
            if (!fileMidi) return;
            currentEditingTarget = 'imported';
            editorTitle.innerText = "Neural Piano Roll Editor (Imported Track)";
            importedEditableNotes = [];
            fileMidi.tracks.forEach(t => {
                t.notes.forEach(n => importedEditableNotes.push({ midi: n.midi, name: n.name, time: n.time, duration: n.duration, velocity: n.velocity }));
            });
            renderPianoRoll(importedEditableNotes);
            editorModal.style.display = 'flex';
        });

        function closeEditor() { 
            editorModal.style.display = 'none'; 
            if (currentEditingTarget === 'imported' && fileMidi) {
                fileMidi.tracks[0].notes = importedEditableNotes.map(n => ({ midi: n.midi, name: n.name, time: n.time, duration: n.duration, velocity: n.velocity }));
            }
        }

        function renderPianoRoll(notesArray) {
            const content = document.getElementById('roll-canvas-content');
            content.innerHTML = '';
            
            notesArray.forEach((n, idx) => {
                const block = document.createElement('div');
                block.className = 'roll-note';
                
                const rowHeight = 10;
                const scaleX = 120;
                
                const pitchTop = (127 - n.midi) * rowHeight;
                block.style.top = `${pitchTop}px`;
                block.style.left = `${n.time * scaleX}px`;
                block.style.width = `${Math.max(n.duration * scaleX, 20)}px`;
                block.style.height = `${rowHeight}px`;
                block.innerText = n.name;

                const handle = document.createElement('div');
                handle.className = 'resize-handle';
                block.appendChild(handle);

                let isDragging = false, isResizing = false;
                let startX = 0, startY = 0, initialTime = n.time, initialMidi = n.midi, initialDuration = n.duration;

                handle.addEventListener('mousedown', (e) => {
                    e.stopPropagation(); isResizing = true; startX = e.clientX; initialDuration = n.duration;
                });

                block.addEventListener('mousedown', (e) => {
                    if (isResizing) return;
                    isDragging = true; startX = e.clientX; startY = e.clientY; initialTime = n.time; initialMidi = n.midi;
                });

                window.addEventListener('mousemove', (e) => {
                    if (isResizing) {
                        const dx = e.clientX - startX;
                        n.duration = Math.max(0.1, initialDuration + (dx / scaleX));
                        block.style.width = `${Math.max(n.duration * scaleX, 20)}px`;
                    } else if (isDragging) {
                        const dx = e.clientX - startX;
                        const dy = e.clientY - startY;
                        n.time = Math.max(0, initialTime + (dx / scaleX));
                        n.midi = Math.max(0, Math.min(127, initialMidi - Math.round(dy / rowHeight)));
                        n.name = Tone.Frequency(n.midi, "midi").toNote();
                        block.style.left = `${n.time * scaleX}px`;
                        block.style.top = `${(127 - n.midi) * rowHeight}px`;
                        block.innerText = n.name;
                    }
                });

                window.addEventListener('mouseup', () => { isDragging = false; isResizing = false; });

                content.appendChild(block);
            });
        }

        // --- Live Section MIDI File Import Logic ---
        const liveFileInput = document.getElementById('live-file-input');
        liveFileInput.addEventListener('change', async (e) => {
            const f = e.target.files[0]; if (!f) return;
            const importedMidi = new Midi(await f.arrayBuffer());
            recNotes = [];
            importedMidi.tracks.forEach(t => {
                t.notes.forEach(n => recNotes.push({ midi: n.midi, name: n.name, time: n.time, duration: n.duration, velocity: n.velocity }));
            });
            if (recNotes.length > 0) {
                btnSave.disabled = false;
                btnOpenEditor.disabled = false;
                btnPlayRec.disabled = false;
                alert("MIDI stream successfully synchronized into Jubal Studio Live Workspace!");
            }
        });

        // --- Metronome Engine ---
        let metronomeRunning = false;
        const metronomeSynth = new Tone.MembraneSynth({ pitchDecay: 0.008, octaves: 2, oscillator: { type: 'sine' }, envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination();
        
        Tone.Transport.scheduleRepeat((time) => {
            if (metronomeRunning) metronomeSynth.triggerAttackRelease("C5", "32n", time);
        }, "4n");

        document.getElementById('metronome-toggle').addEventListener('change', (e) => {
            metronomeRunning = e.target.checked;
            if (metronomeRunning && Tone.Transport.state !== "started") Tone.Transport.start();
        });

        document.getElementById('live-tempo').addEventListener('input', (e) => {
            const bpm = e.target.value;
            Tone.Transport.bpm.value = bpm;
            document.getElementById('live-tempo-val').innerText = bpm;
        });

        // --- Recording & Playback Logic for Live Section ---
        let isRec = false, recStart = 0, recNotes = [], activeRecs = {}, recordedPart = null;
        const btnRec = document.getElementById('btn-record');
        const btnSave = document.getElementById('btn-save');
        const btnOpenEditor = document.getElementById('btn-open-editor');
        const btnPlayRec = document.getElementById('btn-play-rec');
        const btnStopRec = document.getElementById('btn-stop-rec');

        btnRec.addEventListener('click', async () => {
            if (Tone.context.state !== 'running') await Tone.start();
            if (!isRec) {
                isRec = true; recStart = Tone.now(); recNotes = []; activeRecs = {};
                if (metronomeRunning && Tone.Transport.state !== "started") Tone.Transport.start();
                btnRec.classList.add('recording'); btnRec.innerText = '⏹ Halt Matrix Recording'; btnSave.disabled = true; btnOpenEditor.disabled = true; btnPlayRec.disabled = true;
            } else {
                isRec = false;
                btnRec.classList.remove('recording'); btnRec.innerText = '🔴 Record Matrix';
                const now = Tone.now() - recStart;
                for (let n in activeRecs) {
                    recNotes.push({ midi: activeRecs[n].midi, name: n, time: activeRecs[n].time, duration: now - activeRecs[n].time, velocity: activeRecs[n].velocity });
                }
                activeRecs = {};
                if (recNotes.length > 0) {
                    btnSave.disabled = false;
                    btnOpenEditor.disabled = false;
                    btnPlayRec.disabled = false;
                }
            }
        });

        btnPlayRec.addEventListener('click', async () => {
            await Tone.start();
            Tone.Transport.cancel();
            if (recordedPart) recordedPart.dispose();

            const eventsByTime = {};
            recNotes.forEach(n => {
                if (!eventsByTime[n.time]) eventsByTime[n.time] = { notes: [], duration: n.duration, velocity: n.velocity };
                eventsByTime[n.time].notes.push(n.name);
                if (n.duration > eventsByTime[n.time].duration) eventsByTime[n.time].duration = n.duration;
            });

            const partEvents = Object.keys(eventsByTime).map(timeStr => ({
                time: parseFloat(timeStr),
                notes: eventsByTime[timeStr].notes,
                duration: eventsByTime[timeStr].duration,
                velocity: eventsByTime[timeStr].velocity
            }));

            recordedPart = new Tone.Part((time, ev) => {
                activeLiveVoice.triggerAttackRelease(ev.notes, ev.duration, time, ev.velocity);
                Tone.Draw.schedule(() => {
                    activeLiveNotes.clear(); ev.notes.forEach(n => activeLiveNotes.add(n)); updateVisuals(true);
                }, time);
                Tone.Draw.schedule(() => {
                    ev.notes.forEach(n => activeLiveNotes.delete(n)); updateVisuals(true);
                }, time + ev.duration);
            }, partEvents).start(0);

            Tone.Transport.position = 0;
            Tone.Transport.start();
            btnPlayRec.disabled = true; btnStopRec.disabled = false;
        });

        btnStopRec.addEventListener('click', () => {
            Tone.Transport.pause();
            activeLiveNotes.clear(); updateVisuals(true);
            btnPlayRec.disabled = false; btnStopRec.disabled = true;
        });

        btnSave.addEventListener('click', () => {
            if (recNotes.length === 0) return;
            const m = new Midi(); const trk = m.addTrack();
            recNotes.forEach(n => trk.addNote({ midi: n.midi, time: n.time, duration: n.duration, velocity: n.velocity }));
            const blob = new Blob([m.toArray()], { type: "audio/midi" });
            const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "jubal_cyber_perf.mid";
            a.click();
        });

        // --- Web MIDI API Integration ---
        async function initMIDI() {
            if (navigator.requestMIDIAccess) {
                try {
                    const access = await navigator.requestMIDIAccess();
                    const checkInputs = () => {
                        let connected = false;
                        for (let input of access.inputs.values()) {
                            input.onmidimessage = processMIDI;
                            connected = true;
                        }
                        document.getElementById('midi-text').innerText = connected ? "Hardware MIDI: Active" : "Hardware MIDI: Offline";
                        document.getElementById('midi-dot').className = connected ? "midi-dot active" : "midi-dot";
                    };
                    checkInputs();
                    access.onstatechange = checkInputs;
                } catch (e) { console.error(e); }
            }
        }

        function processMIDI(e) {
            if (Tone.context.state !== 'running') Tone.start();
            const [status, note, velocityRaw] = e.data;
            const cmd = status & 0xF0;
            const vel = (velocityRaw || 0) / 127;

            if (cmd === 144 && vel > 0 && drumKit[note]) {
                drumKit[note].triggerAttackRelease("C2", "8n", Tone.now(), vel);
                return;
            }

            const noteName = Tone.Frequency(note, "midi").toNote();
            if (cmd === 144 && vel > 0) {
                activeLiveVoice.triggerAttack(noteName, Tone.now(), vel);
                activeLiveNotes.add(noteName);
                Tone.Draw.schedule(() => updateVisuals(true), Tone.now());
                if (isRec) activeRecs[noteName] = { midi: note, time: Tone.now() - recStart, velocity: vel };
            } else if (cmd === 128 || (cmd === 144 && vel === 0)) {
                activeLiveVoice.triggerRelease(noteName);
                activeLiveNotes.delete(noteName);
                Tone.Draw.schedule(() => updateVisuals(true), Tone.now());
                if (isRec && activeRecs[noteName]) {
                    recNotes.push({ midi: activeRecs[noteName].midi, name: noteName, time: activeRecs[noteName].time, duration: (Tone.now() - recStart) - activeRecs[noteName].time, velocity: activeRecs[noteName].velocity });
                    delete activeRecs[noteName];
                }
            }
        }
        initMIDI();

        // --- Track Timeline & Looping Engine ---
        let fileMidi = null, filePart = null, timelineDuration = 0;
        const fileInput = document.getElementById('file-input');
        const timelineTrack = document.getElementById('timeline-track');
        const timelineProgress = document.getElementById('timeline-progress');
        const timelineLoopRegion = document.getElementById('timeline-loop-region');
        const btnFilePlay = document.getElementById('btn-file-play');
        const btnFileStop = document.getElementById('btn-file-stop');
        const btnOpenFileEditor = document.getElementById('btn-open-file-editor');

        let isDraggingTimeline = false, dragStartX = 0, loopStartSec = 0, loopEndSec = 0;

        fileInput.addEventListener('change', async (e) => {
            const f = e.target.files[0]; if (!f) return;
            fileMidi = new Midi(await f.arrayBuffer());
            timelineDuration = fileMidi.duration;
            loopStartSec = 0; loopEndSec = timelineDuration;
            
            timelineLoopRegion.style.display = 'block';
            timelineLoopRegion.style.left = '0%';
            timelineLoopRegion.style.width = '100%';

            const bpm = fileMidi.header.tempos.length > 0 ? Math.round(fileMidi.header.tempos[0].bpm) : 120;
            Tone.Transport.bpm.value = bpm; 
            document.getElementById('learn-tempo').value = bpm; 
            document.getElementById('learn-tempo-val').innerText = bpm;
            
            btnFilePlay.disabled = false;
            btnOpenFileEditor.disabled = false;
        });

        timelineTrack.addEventListener('mousedown', (e) => {
            if (!fileMidi) return;
            isDraggingTimeline = true;
            const rect = timelineTrack.getBoundingClientRect();
            dragStartX = e.clientX - rect.left;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDraggingTimeline || !fileMidi) return;
            const rect = timelineTrack.getBoundingClientRect();
            const currentX = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
            
            const startX = Math.min(dragStartX, currentX);
            const width = Math.abs(currentX - dragStartX);
            
            timelineLoopRegion.style.display = 'block';
            timelineLoopRegion.style.left = `${(startX / rect.width) * 100}%`;
            timelineLoopRegion.style.width = `${(width / rect.width) * 100}%`;

            loopStartSec = (startX / rect.width) * timelineDuration;
            loopEndSec = ((startX + width) / rect.width) * timelineDuration;
            
            Tone.Transport.loop = true;
            Tone.Transport.loopStart = loopStartSec;
            Tone.Transport.loopEnd = loopEndSec;
        });

        window.addEventListener('mouseup', () => { isDraggingTimeline = false; });

        document.getElementById('learn-tempo').addEventListener('input', (e) => {
            const bpm = e.target.value;
            Tone.Transport.bpm.value = bpm;
            document.getElementById('learn-tempo-val').innerText = bpm;
        });

        function setupFilePlayback() {
            if (!fileMidi) return;
            Tone.Transport.cancel(); if (filePart) filePart.dispose();
            
            const eventsByTime = {};
            fileMidi.tracks.forEach(t => {
                t.notes.forEach(n => {
                    if (!eventsByTime[n.time]) eventsByTime[n.time] = { notes: [], duration: n.duration, velocity: n.velocity };
                    eventsByTime[n.time].notes.push(n.name);
                    if (n.duration > eventsByTime[n.time].duration) eventsByTime[n.time].duration = n.duration;
                });
            });

            const partEvents = Object.keys(eventsByTime).map(timeStr => ({
                time: parseFloat(timeStr),
                notes: eventsByTime[timeStr].notes,
                duration: eventsByTime[timeStr].duration,
                velocity: eventsByTime[timeStr].velocity
            }));

            filePart = new Tone.Part((time, ev) => {
                activeLearnVoice.triggerAttackRelease(ev.notes, ev.duration, time, ev.velocity);
                
                Tone.Draw.schedule(() => {
                    activeLearnNotes.clear(); ev.notes.forEach(n => activeLearnNotes.add(n)); updateVisuals(false);
                }, time);

                Tone.Draw.schedule(() => {
                    ev.notes.forEach(n => activeLearnNotes.delete(n)); updateVisuals(false);
                }, time + ev.duration);
            }, partEvents).start(0);
        }

        btnFilePlay.addEventListener('click', async () => {
            await Tone.start(); setupFilePlayback();
            Tone.Transport.loop = true;
            Tone.Transport.loopStart = loopStartSec;
            Tone.Transport.loopEnd = loopEndSec;
            Tone.Transport.position = loopStartSec;
            Tone.Transport.start();
            btnFilePlay.disabled = true; btnFileStop.disabled = false;
        });

        btnFileStop.addEventListener('click', () => {
            Tone.Transport.pause();
            activeLearnNotes.clear(); updateVisuals(false);
            btnFilePlay.disabled = false; btnFileStop.disabled = true;
        });

        setInterval(() => {
            if (Tone.Transport.state === "started" && timelineDuration > 0) {
                const currentPos = Tone.Transport.seconds;
                const pct = (currentPos / timelineDuration) * 100;
                timelineProgress.style.width = `${Math.min(pct, 100)}%`;
            }
        }, 50);
    </script>
</body>
</html>
